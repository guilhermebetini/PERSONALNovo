<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | OpiniAki</title>
    <link rel="stylesheet" href="css/layout.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Poller+One&family=Syne+Mono&display=swap" rel="stylesheet">
</head>
<body class="login-page">
    <header class="topbar">
        <a href="index.guilherme.html#home" class="brand">Opini<span>Aki</span></a>

        <div class="search">
            <input type="text" placeholder="Buscar no site..." aria-label="Buscar no site">
            <button type="button" aria-label="Buscar"></button>
        </div>

        <nav class="menu" id="menu-principal">
            <a href="index.guilherme.html#home">Home</a>
            <a href="index.guilherme.html#ambiente">Ambiente</a>
            <a href="avaliçao.html">Avaliações</a>
            <a href="login.html" class="is-active">Login</a>
            <a href="contato.html">Contato</a>
        </nav>

        <a href="login.html" class="topbar-cta">Entrar</a>

        <button class="burger" type="button" aria-label="Abrir menu" aria-expanded="false" aria-controls="menu-principal">
            <span></span>
        </button>
    </header>

    <main class="login-page-main">
        <section class="login-screen">
            <div class="login-panel">
                <aside class="login-side">
                    <div>
                        <h2>Bem-vindo de volta</h2>
                        <p>Acesse sua conta agora</p>
                    </div>
                    <a href="login.html" class="login-panel-cta">Entrar</a>
                </aside>

                <div class="login-form-shell">
                    <h2>CRIE SUA CONTA</h2>
                    <form class="login-form" action="#" method="post">
                        <div class="login-field">
                            <i class="material-symbols-outlined">person</i>
                            <input type="text" name="usuario" placeholder="Usuário" required>
                        </div>
                        <div class="login-field">
                            <i class="material-symbols-outlined">mail</i>
                            <input type="email" name="email" placeholder="E-mail" required>
                        </div>
                        <div class="login-field">
                            <i class="material-symbols-outlined">lock</i>
                            <input type="password" name="senha" placeholder="Senha" required>
                        </div>
                        <button type="submit" class="button-primary">Criar conta</button>
                    </form>
                    <p class="login-note">Ainda não tem uma conta? <a href="#">Criar conta</a></p>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
