<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar | OpiniAki</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&family=Montserrat:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="/static/css/layout.css">
    <link rel="stylesheet" href="/static/css/entrar.css">
</head>

<body class="login-page">
    <header class="topbar">
        <a href="index.guilherme.html" class="brand">Opini<span>Aki</span></a>

        <form class="search" action="/buscar/" method="get" role="search">
            <input type="search" name="q" placeholder="Buscar no site..." aria-label="Buscar no site" required>
            <button type="submit" aria-label="Buscar"></button>
        </form>

        <nav class="menu" id="menu-principal">
            <a href="index.guilherme.html">Home</a>
            <a href="index.guilherme.html">Ambiente</a>
            <a href="avaliacao.html">Avaliações</a>
            <a href="contato.html">Contato</a>
        </nav>

        <a href="entrar.html" class="topbar-cta">Entrar</a>

        <button class="burger" type="button" aria-label="Abrir menu" aria-expanded="false" aria-controls="menu-principal">
            <span></span>
        </button>
    </header>

    <main class="login-page-main">
        <section class="login-screen">
            <div class="login-panel">
                <aside class="login-side">
                    <div>
                        <h2>JÁ TEM UMA CONTA?</h2>
                        <p>Clique em entrar para acessar o dashboard.</p>
                    </div>
                    <a href="entrar.html" class="login-panel-cta">Entrar</a>
                </aside>

                <div class="login-form-shell">
                    <h2>CADASTRAR</h2>
                    <form class="login-form" id="register-form" action="/cadastrar/" method="post">
                        {% csrf_token %}
                        <div class="login-field">
                            <i class="material-symbols-outlined"></i>
                            <input type="text" name="nome" id="nome" value="{{ name }}" placeholder="Nome" minlength="2" maxlength="150" required>
                        </div>

                        <div class="login-field">
                            <i class="material-symbols-outlined"></i>
                            <input type="text" name="usuario" id="usuario" value="{{ username }}" placeholder="Usuário" minlength="3" maxlength="150" autocomplete="username" required>
                        </div>

                        <div class="login-field">
                            <i class="material-symbols-outlined"></i>
                            <input type="password" name="senha" id="senha" placeholder="Senha (mínimo de 8 caracteres)" minlength="8" autocomplete="new-password" required>
                        </div>

                        <button type="submit" class="button-primary">Cadastrar</button>
                    </form>
                    {% if status_message %}
                    <p class="login-note" id="register-status" role="status" aria-live="polite" style="color:#b10f0f">{{ status_message }}</p>
                    {% endif %}
                </div>
            </div>
        </section>
    </main>


    <script>
        const burger = document.querySelector('.burger');
        const menu = document.getElementById('menu-principal');

        if (burger && menu) {
            burger.addEventListener('click', function () {
                const isOpen = menu.classList.toggle('is-open');
                burger.classList.toggle('is-open', isOpen);
                burger.setAttribute('aria-expanded', String(isOpen));
            });
        }
    </script>
</body>
</html>
