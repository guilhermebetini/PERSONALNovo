<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar | OpiniAki</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&family=Montserrat:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/entrar.css">
</head>

<body class="login-page">
    <header class="topbar">
        <a href="index.guilherme.html" class="brand">Opini<span>Aki</span></a>

        <div class="search">
            <input type="text" placeholder="Buscar no site..." aria-label="Buscar no site">
            <button type="button" aria-label="Buscar"></button>
        </div>

        <nav class="menu" id="menu-principal">
            <a href="index.guilherme.html">Home</a>
            <a href="index.guilherme.html">Ambiente</a>
            <a href="avaliacao.html">Avaliações</a>
            <a href="contato.html">Contato</a>
        </nav>

        <a href="entrar.html" class="topbar-cta">Entrar</a>

        <button class="burger" type="button" aria-label="Abrir menu" aria-expanded="false" aria-controls="menu-principal">
            <span></span>
        </button>
    </header>

    <main class="login-page-main">
        <section class="login-screen">
            <div class="login-panel">
                <aside class="login-side">
                    <div>
                        <h2>JÁ TEM UMA CONTA?</h2>
                        <p>Clique em entrar para acessar o dashboard.</p>
                    </div>
                    <a href="entrar.html" class="login-panel-cta">Entrar</a>
                </aside>

                <div class="login-form-shell">
                    <h2>CADASTRAR</h2>
                    <form class="login-form" id="register-form" action="#" method="post" novalidate>
                        <div class="login-field">
                            <i class="material-symbols-outlined">badge</i>
                            <input type="text" name="nome" id="nome" placeholder="Nome">
                        </div>

                        <div class="login-field">
                            <i class="material-symbols-outlined">person</i>
                            <input type="text" name="usuario" id="usuario" placeholder="Usuário" required>
                        </div>

                        <div class="login-field">
                            <i class="material-symbols-outlined">lock</i>
                            <input type="password" name="senha" id="senha" placeholder="Senha" required>
                        </div>

                        <button type="submit" class="button-primary">Cadastrar</button>
                    </form>
                    <p class="login-note" id="register-status"></p>
                </div>
            </div>
        </section>
    </main>

    <script>
        const form = document.getElementById('register-form');
        const nameInput = document.getElementById('nome');
        const userInput = document.getElementById('usuario');
        const passInput = document.getElementById('senha');
        const statusText = document.getElementById('register-status');
        const burger = document.querySelector('.burger');
        const menu = document.getElementById('menu-principal');

        form.addEventListener('submit', function (event) {
            event.preventDefault();

            const name = nameInput.value.trim();
            const user = userInput.value.trim();
            const pass = passInput.value;

            if (name.length < 2 || user.length < 3 || pass.length < 4) {
                statusText.textContent = 'Preencha nome, usuário e senha corretamente.';
                statusText.style.color = '#b10f0f';
                return;
            }

            statusText.textContent = 'Cadastro enviado. Agora clique em Entrar.';
            statusText.style.color = '#1f8a35';
            form.reset();
        });

        burger.addEventListener('click', function () {
            const isOpen = menu.classList.toggle('is-open');
            burger.classList.toggle('is-open', isOpen);
            burger.setAttribute('aria-expanded', String(isOpen));
        });
    </script>
</body>
</html>
